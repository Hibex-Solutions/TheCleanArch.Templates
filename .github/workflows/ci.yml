name: Continuous Integration

on:
  push:
    branches:
      - "main"

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore

      - name: Build
        run: dotnet build --nologo -c Release --no-restore -warnaserror

      - name: GitVersion
        run: dotnet gitversion